<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <header>
        <h1>TNG CAFE</h1>
        <p>心安らぐ一杯をあなたに</p>
        <nav>
            <ul>
                <li><a href="#about">About Us</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>
                TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>
                自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。
            </p>

            <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80" alt="カフェの写真">
        </section>

        <section id="menu">
            <h2>Menu</h2>

            <div class="menu=list">

                <div class="menu=card">
                    <img src="https://images.unsplash.com/photo-1595474472287-4d71bcdd2085?auto=format&crop&w=500&=80" alt="コーヒー">
                    <p>ブレンドコーヒー</p>
                </div>

                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&crop&w=500&=80" alt="ケーキ">
                    <p>ベイクドチーズケーキ</p>
                </div>

                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?auto=format&crop&w=500&=80" alt="ラテ">
                    <p>カフェラテ</p>
                </div>

            </div>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            
            <form>
            <label for="name">お名前</label>
            <input type="text" id="name" name="name">
            
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email">
            
            <label for="message">お問い合わせ内容</label>
            <textarea id="message" name="message"></textarea>
            
            <button type="submit">送信</button>
            </form>
            </section>
    </main>
</body></html>
